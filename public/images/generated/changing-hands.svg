<text x="300" y="1094" text-anchor="middle" font-family="'Instrument Sans','Segoe UI',Arial,sans-serif" font-size="28" fill="#faf5ec" fill-opacity=".7">buy Bengaluru</text></g><g opacity="0.45"><circle cx="800" cy="860" r="130" fill="#1b1840" stroke="#e2b33c" stroke-width="5"/><path d="M760 810 h80 M760 810 l40 -34 l40 34 M770 810 v-6 M830 810 v-6" stroke="#e2b33c" stroke-width="5" fill="none"/>
