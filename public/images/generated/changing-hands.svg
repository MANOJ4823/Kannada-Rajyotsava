<text x="800" y="654" text-anchor="middle" font-family="'Instrument Sans','Segoe UI',Arial,sans-serif" font-size="28" fill="#faf5ec" fill-opacity=".7">Bijapur general</text></g><g opacity="1"><circle cx="1300" cy="420" r="130" fill="#1b1840" stroke="#e2b33c" stroke-width="5"/><path d="M1254 368 l18 -40 l28 26 l28 -26 l18 40 z" fill="#e2b33c" opacity=".9"/>
